# nginx reverse proxy for the Weelp Integration Gateway.
#
# Drop into /etc/nginx/sites-available/gateway.weelp.com.conf and symlink into
# sites-enabled. Reload with `nginx -s reload` after `nginx -t` reports OK.
#
# Operational notes:
#   * TLS terminates here. The gateway behind it speaks plain HTTP on 127.0.0.1:9100.
#   * /v1/places/* is rate-limited by the gateway itself (slowapi → Redis). Do NOT
#     add an `limit_req` zone here for those paths — two layers produce two
#     different 429 shapes depending on which trips first.
#   * X-Request-ID is forwarded as-is. The gateway middleware accepts it only when
#     it matches ^[A-Za-z0-9-]{8,64}$, so spoofed values get replaced with a
#     freshly minted id rather than poisoning logs.

# Upstream lives on loopback — host nginx is the only thing that reaches the gateway.
upstream weelp_gateway {
    server 127.0.0.1:9100;
    keepalive 32;
}

# 80 → 443 redirect. Certbot manages cert renewal in-place.
server {
    listen 80;
    listen [::]:80;
    server_name gateway.weelp.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name gateway.weelp.com;

    ssl_certificate     /etc/letsencrypt/live/gateway.weelp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gateway.weelp.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Modest cap; geocode payloads are small. Bump if /v1/places/reverse ever
    # accepts batched bodies.
    client_max_body_size 1m;

    # Logs (separate file makes correlation with gateway request_ids easier).
    access_log /var/log/nginx/gateway.weelp.com.access.log;
    error_log  /var/log/nginx/gateway.weelp.com.error.log warn;

    # Health probe — keep cheap, never cache, never auth.
    location = /v1/health {
        proxy_pass http://weelp_gateway;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    location / {
        proxy_pass http://weelp_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";

        # Trace + identity propagation.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     $http_authorization;
        proxy_set_header X-Request-ID      $http_x_request_id;

        # Timeouts: upstream provider calls can take a beat; keep these honest.
        proxy_connect_timeout 5s;
        proxy_send_timeout    15s;
        proxy_read_timeout    15s;

        # Don't buffer streamed/JSON responses — gateway is small and fast.
        proxy_buffering off;
    }
}
