[project]
name = "gateway"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ashish Khawla", email = "khawla@fanaticcoders.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.0",
    "tenacity>=9.1.4",
    "uvicorn[standard]>=0.46.0",
    "redis>=5.0.0",
    "purgatory>=3.0.0",
    "slowapi>=0.1.9",
    "structlog>=24.1.0",
    "pyjwt>=2.8.0",
    "prometheus-fastapi-instrumentator==7.1.0",
    # OTel pinned exactly: auto-instrumentations move fast and a floating range
    # will silently produce a different image. Bump deliberately, not by drift.
    "opentelemetry-api==1.41.1",
    "opentelemetry-sdk==1.41.1",
    "opentelemetry-exporter-otlp==1.41.1",
    "opentelemetry-instrumentation-fastapi==0.62b1",
    "opentelemetry-instrumentation-httpx==0.62b1",
    "opentelemetry-instrumentation-redis==0.62b1",
]

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "respx>=0.23.1",
    "ruff>=0.15.12",
    "fakeredis>=2.23.0",
]
