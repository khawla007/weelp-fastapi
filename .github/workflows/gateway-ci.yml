name: gateway-ci

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/gateway-ci.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/gateway-ci.yml"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.8.22"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies (incl. dev)
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check src tests

      - name: Test
        env:
          # The settings loader requires these. Tests stub real values; CI just needs
          # something parseable so Settings() instantiates.
          MAPBOX_TOKEN: ci-test-token
          JWT_SECRET: ci-test-secret-32-bytes-padded-xx
          NOMINATIM_USER_AGENT: weelp-gateway-ci/0.1
        run: uv run pytest -q
