services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: weelp-gateway:latest
    env_file: .env
    environment:
      # In-container DNS — the redis service name resolves on the compose network.
      REDIS_URL: redis://redis:6379/0
      RATE_LIMIT_STORAGE_URI: redis://redis:6379/0
    ports:
      - "9100:9100"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9100/v1/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      # Exposed for dev convenience (redis-cli from the host). Stripped in compose.prod.yml.
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
